<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden of Wisdom - VR Flashcard Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', 'Crimson Text', serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a2a1a 0%, #2d4a2d 100%);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f1f0f 0%, #1a2e1a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-text {
            font-size: 2rem;
            color: #d4e8d4;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 2rem;
            animation: fadeInOut 2s ease-in-out infinite;
        }

        .loading-bar {
            width: 300px;
            height: 2px;
            background: rgba(212, 232, 212, 0.2);
            position: relative;
            overflow: hidden;
        }

        .loading-progress {
            position: absolute;
            height: 100%;
            background: linear-gradient(90deg, transparent, #d4e8d4, transparent);
            width: 50%;
            animation: loading 1.5s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @keyframes loading {
            0% { left: -50%; }
            100% { left: 100%; }
        }

        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .title-card {
            position: absolute;
            top: 3rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #d4e8d4;
            opacity: 0;
            animation: titleFadeIn 1.5s ease forwards 0.5s;
        }

        .title-card h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .title-card p {
            font-size: 1rem;
            letter-spacing: 0.15em;
            opacity: 0.8;
            text-transform: uppercase;
            font-weight: 300;
        }

        .instructions {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #d4e8d4;
            opacity: 0;
            animation: titleFadeIn 1.5s ease forwards 1s;
        }

        .instructions p {
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            opacity: 0.7;
            margin: 0.3rem 0;
        }

        .instructions .keys {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            opacity: 0.9;
            letter-spacing: 0.2em;
        }

        @keyframes titleFadeIn {
            to {
                opacity: 1;
            }
        }

        .pointer-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(212, 232, 212, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            transition: transform 0.15s ease, border-color 0.2s ease;
            display: none;
        }

        .pointer-cursor.active {
            transform: scale(1.5);
            border-color: rgba(255, 200, 200, 0.9);
            background: radial-gradient(circle, rgba(255, 200, 200, 0.3), transparent);
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-text">Garden of Wisdom</div>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div class="title-card">
            <h1>Garden of Wisdom</h1>
            <p>A sanctuary of inspiration</p>
        </div>
        <div class="instructions">
            <p class="keys">W A S D</p>
            <p>Move around the garden</p>
            <p>Click & Drag to look around</p>
            <p>Click on flashcards to reveal wisdom</p>
        </div>
    </div>

    <div class="pointer-cursor" id="pointerCursor"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="main.js"></script>
</body>
</html>
